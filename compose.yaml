services:
  db:
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baking_and_crafts_kjg}
      POSTGRES_USER: ${POSTGRES_USER:-baking_and_crafts_kjg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baking_and_crafts_kjg_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
